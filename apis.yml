name: Fernride
description: >-
  FERNRIDE (FERNRIDE GmbH) is a Munich, Germany based ground-autonomy company
  delivering human-assisted autonomous driving for logistics. Its platform
  automates electric and diesel trucks and terminal tractors across container
  terminals, yard operations, manufacturing supply, defence logistics, and
  open-road trucking, pairing on-vehicle autonomy with remote human oversight
  (teleoperation) for reliability at scale. A centralized Management Suite lets
  fleet managers monitor and control the autonomous fleet and integrates with
  existing terminal operating systems (TOS) and yard management systems (YMS).
  Customers and partners have included DB Schenker, Volkswagen, HHLA, and NVIDIA.
  FERNRIDE was acquired by Quantum Systems in December 2025. This profile was
  surfaced as a portfolio company of Speedinvest; the company exposes no public
  developer portal, API, or documentation surface at the time of enrichment.
